name: adventurers-hub

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: adventurers_hub
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME in .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo/init-app-user.sh:/docker-entrypoint-initdb.d/01-init-app-user.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval 'db.adminCommand("ping").ok' | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: 0.0.0.0
      PORT: 5000
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      MONGO_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongo:27017/adventurers_hub?authSource=adventurers_hub
      FOUNDRY_DATA_PATH: /data/foundry/imports
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-Lax}
      TRUST_PROXY_COUNT: 1
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    volumes:
      - foundry_assets:/data/foundry
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 5000), timeout=2).close()"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - app
      - data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_FOUNDRY_URL: ${VITE_FOUNDRY_URL:-http://localhost:30000}
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - app

volumes:
  mongo_data:
  foundry_assets:

networks:
  app:
  data:
    internal: true
